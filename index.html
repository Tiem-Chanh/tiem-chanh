<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description"
          content="Tiệm Chanh — đọc những câu chuyện hay, chăm một khu vườn nhỏ.">
    <title>Tiệm Chanh — Đọc truyện</title>

    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="public/assets/icon/Trang%20ch%E1%BB%A7.png">
</head>

<body>
<a href="#main" class="skip-link">Đi đến nội dung chính</a>

<header class="header">
    <div class="header-inner">
        <a href="#home" class="brand" data-action="navigate" data-page="home">
            <img data-asset="logo" alt="Logo Tiệm Chanh" width="150" height="64">
        </a>

        <form class="search" id="search-form" role="search">
            <label for="search-input" class="sr-only">Tìm tên truyện, tác giả, thể loại</label>
            <span id="search-icon" aria-hidden="true"></span>
            <input id="search-input" type="search"
                   placeholder="Tìm câu chuyện tiếp theo của bạn…"
                   autocomplete="off">
        </form>

        <div class="header-actions">
            <button class="icon-button quiet" data-action="settings"
                    aria-label="Tùy chỉnh giao diện" id="settings-button"></button>
            <button class="icon-button quiet notification" data-action="notifications"
                    aria-label="Xem thông báo" id="notifications-button"></button>
            <button class="profile-button" data-action="navigate" data-page="house"
                    aria-label="Đến Nhà của bạn">
                <span id="header-avatar"></span>
                <span id="header-name"></span>
            </button>
        </div>
    </div>
</header>

<div class="layout">
    <aside class="sidebar" aria-label="Điều hướng chính">
        <div class="mascot">
            <img id="mascot" alt="Nhân vật Chanh nhảy múa" width="115" height="95">
            <small>Hôm nay, đọc gì nhỉ?</small>
        </div>
        <div class="menu-label eyebrow">Góc của bạn</div>
        <nav class="nav" id="desktop-nav"></nav>

        <div class="sidebar-note">
            <div class="row">
                <img data-asset="coin" alt="" width="25" height="25">
                <strong style="font-size:12px">Ở lại thêm một chút</strong>
            </div>
            <p>Mỗi 10 phút hoạt động hợp lệ, nhận thêm 1 xu chanh.</p>
            <button class="text-button" data-action="garden-home">
                Chăm khu vườn →
            </button>
        </div>
        <div class="sidebar-footer">TIỆM CHANH © 2026<br>Góc đọc truyện của bạn.</div>
    </aside>

    <main id="main" tabindex="-1"></main>
    <aside class="right-column" id="right-column" aria-label="Góc cộng đồng"></aside>
</div>

<nav class="mobile-nav" id="mobile-nav" aria-label="Điều hướng trên điện thoại"></nav>

<dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-heading">
        <h2 id="dialog-title"></h2>
        <button class="icon-button quiet" data-action="close-dialog" aria-label="Đóng">×</button>
    </div>
    <div id="dialog-body"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
