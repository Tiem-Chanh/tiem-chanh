<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quầy Bán Chanh 🍋</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffff00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #ffffff;
        }
        .box {
            background: #1b263b;
            border: 2px solid #ffff00;
            display: inline-block;
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🍋 Quầy Bán Chanh 🍋</h1>
        <p>Trang web chính thức đã lên sóng cực kỳ mượt mà!</p>
    </div>
</body>
</html>
